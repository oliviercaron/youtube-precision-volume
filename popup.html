<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube Precision Volume</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Precision volume</h1>

  <div id="current" title="Click and drag horizontally to adjust volume">
    <div class="current-fill"></div>
    <div class="current-content">
      <span class="label">Volume (Drag to slide)</span>
      <span id="current-volume">—</span>
    </div>
  </div>

  <div id="presets">
    <button class="preset" data-percent="1">1%</button>
    <button class="preset" data-percent="10">10%</button>
    <button class="preset" data-percent="20">20%</button>
    <button class="preset" data-percent="30">30%</button>
    <button class="preset" data-percent="40">40%</button>
    <button class="preset" data-percent="50">50%</button>
    <button class="preset" data-percent="60">60%</button>
    <button class="preset" data-percent="70">70%</button>
    <button class="preset" data-percent="80">80%</button>
    <button class="preset" data-percent="90">90%</button>
    <button class="preset" data-percent="100">100%</button>
  </div>

  <form id="custom-form">
    <input type="text" id="custom-percent" inputmode="decimal"
           placeholder="Custom % (e.g. 15)" autocomplete="off">
    <button type="submit" id="apply">Apply</button>
  </form>

  <p id="status" role="status"></p>

  <script src="popup.js"></script>
</body>
</html>
